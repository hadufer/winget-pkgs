ShortDescription: Windows taskbar widget showing Claude Code, Codex and Antigravity usage, coloured by consumption pace.
Description: |-
  The taskbar widget is drawn as an instrument panel: each usage window is a
  tape whose fill is what was used and whose marker is where the clock says you
  should be, coloured by consumption pace rather than raw percentage. A click
  opens a panel with every limit, including the per-model weekly one, its exact
  reset time and a warning when the limit would arrive before the reset at the
  current rate. Codex and Antigravity usage can be shown alongside Claude Code.
  Renamed AI Usage Monitor and published as hadufer.AIUsageMonitor from now on; from this version the app keeps itself current from its GitHub releases, whichever identifier installed it.
